<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>VidGrab</title>
<style>
  :root{--bg:#0c0d10;--panel:#141619;--line:#25292f;--tx:#e8eaed;
        --dim:#8b929c;--dim2:#5f666f;--acc:#5b8cff;--ok:#3ecf8e;--warn:#f5a623}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:var(--bg);color:var(--tx);
    display:grid;place-items:center;padding:24px;
    font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    background-image:radial-gradient(700px 420px at 50% 0%,rgba(91,140,255,.15),transparent 70%)}
  .box{width:100%;max-width:390px;text-align:center}
  .logo{width:52px;height:52px;border-radius:15px;margin:0 auto 18px;
    background:linear-gradient(145deg,var(--acc),#a06bff);display:grid;place-items:center;
    box-shadow:0 10px 30px rgba(91,140,255,.35)}
  .logo svg{width:26px;height:26px;fill:#fff}
  h1{font-size:21px;margin:0 0 6px;letter-spacing:-.3px}
  .lede{color:var(--dim2);font-size:13.5px;margin-bottom:26px}
  .state{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px 20px}
  .row{display:flex;align-items:center;justify-content:center;gap:9px;
    font-size:13.5px;color:var(--dim)}
  .dot{width:8px;height:8px;border-radius:50%;flex:none}
  .dot.on{background:var(--ok);box-shadow:0 0 10px rgba(62,207,142,.6)}
  .dot.off{background:var(--warn)}
  .spin{width:14px;height:14px;border:2px solid rgba(255,255,255,.14);
    border-top-color:var(--acc);border-radius:50%;animation:sp .7s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  input,button{font-family:inherit;font-size:14px}
  input{width:100%;background:#0f1114;border:1px solid var(--line);border-radius:10px;
    color:var(--tx);padding:11px 13px;outline:0;margin-top:14px}
  input:focus{border-color:#3a4a75;box-shadow:0 0 0 3px rgba(91,140,255,.13)}
  button{width:100%;margin-top:10px;background:var(--acc);color:#fff;border:0;
    border-radius:10px;padding:12px;font-weight:600;cursor:pointer;transition:.15s}
  button:hover{background:#7aa2ff}
  .link{display:block;margin-top:14px;color:var(--acc);text-decoration:none;
    font-size:13px;word-break:break-all}
  .hint{color:var(--dim2);font-size:12px;margin-top:16px;line-height:1.55}
  .ghost{background:transparent;border:1px solid var(--line);color:var(--dim);margin-top:12px}
  .ghost:hover{background:transparent;color:var(--tx);border-color:#39404a}
  .err{color:#ffa7a7;font-size:12.5px;margin-top:10px;min-height:16px}
</style>
</head>
<body>
<div class="box">
  <div class="logo"><svg viewBox="0 0 24 24"><path d="M12 2a1.5 1.5 0 0 1 1.5 1.5v9.4l3.4-3.4a1.5 1.5 0 1 1 2.2 2.2l-6 6a1.5 1.5 0 0 1-2.2 0l-6-6a1.5 1.5 0 1 1 2.2-2.2l3.4 3.4V3.5A1.5 1.5 0 0 1 12 2ZM4 19.5A1.5 1.5 0 0 1 5.5 18h13a1.5 1.5 0 0 1 0 3h-13A1.5 1.5 0 0 1 4 19.5Z"/></svg></div>
  <h1>VidGrab</h1>
  <div class="lede">Bookmark this page. It always finds the app.</div>
  <div class="state" id="state">
    <div class="row"><div class="spin"></div> Looking for your Mac…</div>
  </div>
  <div class="hint" id="hint"></div>
</div>

<script>
const $ = s => document.querySelector(s);
const KEY = 'vidgrab.pass';

function go(url, pass){
  location.href = url.replace(/\/$/,'') + '/?k=' + encodeURIComponent(pass);
}

function askPass(url){
  $('#state').innerHTML = `
    <div class="row"><div class="dot on"></div> Your Mac is online</div>
    <input type="password" id="p" placeholder="Passphrase" autocomplete="current-password">
    <button id="ok">Open VidGrab</button>
    <div class="err" id="e"></div>`;
  $('#hint').textContent = 'Asked once per device. Stored only in this browser.';
  const submit = () => {
    const v = $('#p').value.trim();
    if(!v){ $('#e').textContent = 'Enter your passphrase.'; return; }
    try{ localStorage.setItem(KEY, v); }catch(_){}
    go(url, v);
  };
  $('#ok').onclick = submit;
  $('#p').onkeydown = e => { if(e.key === 'Enter') submit(); };
  $('#p').focus();
}

function offline(updated){
  const ago = updated
    ? Math.round((Date.now()/1000 - updated)/60) + ' min ago'
    : 'unknown';
  $('#state').innerHTML = `
    <div class="row"><div class="dot off"></div> Your Mac is offline</div>
    <button class="ghost" onclick="location.reload()">Check again</button>`;
  $('#hint').innerHTML = `VidGrab runs on your Mac, so it needs that Mac awake and
    online. Last seen ${ago}.<br><br>
    <a class="link" href="#" onclick="localStorage.removeItem('${KEY}');location.reload();return false">Forget saved passphrase</a>`;
}

(async () => {
  try{
    const r = await fetch('status.json?t=' + Date.now(), {cache:'no-store'});
    const s = await r.json();
    if(!s.url) return offline(s.updated);
    let saved = null;
    try{ saved = localStorage.getItem(KEY); }catch(_){}
    if(saved) return go(s.url, saved);
    askPass(s.url);
  }catch(e){
    $('#state').innerHTML =
      `<div class="row"><div class="dot off"></div> Couldn't read status</div>
       <button class="ghost" onclick="location.reload()">Retry</button>`;
  }
})();
</script>
</body>
</html>
